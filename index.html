{

<script type="module">
  // محاكاة window.storage عبر localStorage عشان يشتغل بدون خادم
  window.storage = {
    async get(key) {
      const value = localStorage.getItem(key);
      return value !== null ? { key, value, shared: false } : null;
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      const existed = localStorage.getItem(key) !== null;
      localStorage.removeItem(key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  }
</script>

<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useRef } from "react";
import ReactDOM from "react-dom/client";
import {
  Swords, Shield, Brain, Wind, Eye, BookOpen, MessageCircle,
  Plus, Check, X, Flame, RotateCcw, ChevronUp, Lock, Clock,
  Award, Skull, Home, User, Settings as SettingsIcon, History as HistoryIcon,
  Trash2, Pencil, Castle,
} from "lucide-react";

/* ---------------- constants ---------------- */

const DEFAULT_ATTRS = [
  { id: "strength", name: "القوة" },
  { id: "vitality", name: "الحيوية" },
  { id: "intelligence", name: "الذكاء" },
  { id: "agility", name: "الرشاقة" },
  { id: "perception", name: "الإدراك" },
  { id: "wisdom", name: "الحكمة" },
  { id: "charisma", name: "الكاريزما" },
];

const MANDATORY_TEMPLATES = [
  { id: "m1", name: "تمارين بطن", xp: 10, attributeId: "strength", type: "mandatory_penalty" },
  { id: "m2", name: "تمارين علوية", xp: 10, attributeId: "strength", type: "mandatory_penalty" },
  { id: "m3", name: "شرب الماء", xp: 5, attributeId: "vitality", type: "mandatory_penalty" },
  { id: "m4", name: "النوم المبكر", xp: 10, attributeId: "vitality", type: "mandatory_penalty" },
  { id: "m5", name: "تعلم 10 كلمات جديدة", xp: 12, attributeId: "intelligence", type: "mandatory_penalty" },
  { id: "m6", name: "دراسة", xp: 15, attributeId: "intelligence", type: "mandatory_penalty" },
  { id: "m7", name: "ألعاب الألغاز", xp: 5, attributeId: "perception", type: "mandatory_penalty" },
  { id: "m8", name: "تمارين المرونة", xp: 7, attributeId: "agility", type: "mandatory_penalty" },
  { id: "n1", name: "الأكل الصحي", xp: 9, attributeId: "vitality", type: "mandatory_no_penalty" },
  { id: "n2", name: "قراءة", xp: 5, attributeId: "intelligence", type: "mandatory_no_penalty" },
  { id: "n3", name: "المشي", xp: 15, attributeId: "agility", type: "mandatory_no_penalty" },
  { id: "n4", name: "تمارين التوازن", xp: 7, attributeId: "agility", type: "mandatory_no_penalty" },
  { id: "n5", name: "تأمل", xp: 6, attributeId: "perception", type: "mandatory_no_penalty" },
  { id: "n6", name: "مراجعة أسبوعية", xp: 52, attributeId: "wisdom", type: "mandatory_no_penalty" },
  { id: "n7", name: "قراءة فلسفة", xp: 8, attributeId: "wisdom", type: "mandatory_no_penalty" },
  { id: "n8", name: "تحسين المهارات الاجتماعية", xp: 15, attributeId: "charisma", type: "mandatory_no_penalty" },
  { id: "n9", name: "التأثير", xp: 15, attributeId: "charisma", type: "mandatory_no_penalty" },
];

const RANKS = [
  { min: 1, max: 9, name: "E", color: "#7a8ba8" },
  { min: 10, max: 24, name: "D", color: "#4f9eff" },
  { min: 25, max: 44, name: "C", color: "#7dd3fc" },
  { min: 45, max: 69, name: "B", color: "#a78bfa" },
  { min: 70, max: 99, name: "A", color: "#fbbf24" },
  { min: 100, max: 129, name: "S", color: "#ff3b5c" },
  { min: 130, max: 134, name: "؟", color: "#5b7a9e" },
  { min: 135, max: 200, name: "X", color: "#ff0090" },
];

const MAX_LEVEL = 200;
const STORAGE_KEY = "solo-system-state-v1";

function xpToNext(level) { return 50 * (level + 1); }
function getRank(level) { return RANKS.find((r) => level >= r.min && level <= r.max) || RANKS[0]; }
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function isUnlockedNow() { return new Date().getHours() >= 3; }
function msUntilBoundary() {
  const now = new Date();
  const target = new Date(now);
  if (now.getHours() >= 3) {
    target.setDate(target.getDate() + 1);
    target.setHours(0, 0, 0, 0);
  } else {
    target.setHours(3, 0, 0, 0);
  }
  return target - now;
}
function formatDuration(ms) {
  if (ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function defaultState() {
  return {
    name: "الصياد",
    level: 1,
    xp: 0,
    attributes: DEFAULT_ATTRS.map((a) => ({ ...a, value: 0, progress: 0 })),
    skills: [],
    titles: [],
    mandatoryXpOverride: {},
    mandatoryStatus: {},
    optionalTasks: [],
    penalties: [],
    dungeons: [],
    history: [],
    cycleDate: todayStr(),
  };
}

function applyAttributeDelta(attributes, attributeId, delta) {
  return attributes.map((a) => {
    if (a.id !== attributeId) return a;
    let progress = a.progress + delta;
    let value = a.value;
    while (progress >= 2) { progress -= 2; value += 1; }
    while (progress < 0) { progress += 2; value = Math.max(0, value - 1); }
    return { ...a, value, progress };
  });
}

export default function App() {
  const [state, setState] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("home");
  const [levelUp, setLevelUp] = useState(null);
  const [now, setNow] = useState(new Date());
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY);
        const data = res ? JSON.parse(res.value) : defaultState();
        setState(gradeIfNeeded(data).state);
      } catch {
        setState(defaultState());
      }
      setLoading(false);
    })();
  }, []);

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    const t = setInterval(() => {
      setState((s) => {
        if (!s) return s;
        const { state: graded, changed } = gradeIfNeeded(s);
        return changed ? graded : s;
      });
    }, 20000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (!state) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      window.storage.set(STORAGE_KEY, JSON.stringify(state)).catch(() => {});
    }, 400);
  }, [state]);

  function gradeIfNeeded(s) {
    if (s.cycleDate === todayStr()) return { state: s, changed: false };
    let attributes = s.attributes;
    let penalties = [...s.penalties];
    let failedA = 0;
    let completedCount = 0;

    const mandatorySnapshot = MANDATORY_TEMPLATES.map((tpl) => {
      const status = s.mandatoryStatus[tpl.id] || "pending";
      if (status === "completed") completedCount += 1;
      else if (tpl.type === "mandatory_penalty") failedA += 1;
      return { id: tpl.id, name: tpl.name, status: status === "completed" ? "completed" : tpl.type === "mandatory_penalty" ? "failed" : "not_completed" };
    });

    if (failedA >= 8) {
      penalties.push({ id: uid("p"), type: "full_day", description: "فشل كامل: اكتب 50 كلمة صينية جديدة مع معانيها", completed: false, date: s.cycleDate });
    } else if (failedA >= 3) {
      penalties.push({ id: uid("p"), type: "three_tasks", description: "20 دقيقة جري متواصل + ساعة كاملة بدون هاتف", completed: false, date: s.cycleDate });
    } else if (failedA >= 1) {
      penalties.push({ id: uid("p"), type: "one_task", description: `ساعة واحدة بدون هاتف (${failedA} مهمة فاشلة)`, completed: false, date: s.cycleDate });
    }

    const history = [
      { date: s.cycleDate, level: s.level, xp: s.xp, completed: completedCount, failed: failedA, tasks: mandatorySnapshot },
      ...s.history,
    ].slice(0, 60);

    return { state: { ...s, attributes, penalties, history, mandatoryStatus: {}, cycleDate: todayStr() }, changed: true };
  }

  if (loading || !state) {
    return <div style={sx.loadingScreen}>جارٍ استدعاء النظام...</div>;
  }

  const rank = getRank(state.level);
  const need = xpToNext(state.level);
  const xpPct = Math.min(100, (state.xp / need) * 100);
  const unlocked = isUnlockedNow();
  const countdown = formatDuration(msUntilBoundary());
  const xpEditUnlocked = state.level >= 25;

  const attrMap = {};
  state.attributes.forEach((a) => (attrMap[a.id] = a));

  function gainXp(amount) {
    setState((s) => {
      let xp = s.xp + amount;
      let level = s.level;
      if (amount > 0) {
        let threshold = xpToNext(level);
        while (xp >= threshold && level < MAX_LEVEL) {
          xp -= threshold;
          level += 1;
          threshold = xpToNext(level);
          setLevelUp({ level });
        }
        if (level >= MAX_LEVEL) xp = Math.min(xp, threshold);
      } else {
        xp = Math.max(0, xp);
      }
      return { ...s, xp, level };
    });
  }

  function toggleMandatory(tpl) {
    if (!unlocked) return;
    setState((s) => {
      const current = s.mandatoryStatus[tpl.id] || "pending";
      const nextStatus = current === "completed" ? "pending" : "completed";
      const delta = nextStatus === "completed" ? 1 : -1;
      return {
        ...s,
        mandatoryStatus: { ...s.mandatoryStatus, [tpl.id]: nextStatus },
        attributes: applyAttributeDelta(s.attributes, tpl.attributeId, delta),
      };
    });
    const xpVal = state.mandatoryXpOverride[tpl.id] ?? tpl.xp;
    const current = state.mandatoryStatus[tpl.id] || "pending";
    gainXp(current === "completed" ? -xpVal : xpVal);
  }

  function toggleOptional(id) {
    setState((s) => {
      const task = s.optionalTasks.find((t) => t.id === id);
      if (!task) return s;
      const nextStatus = task.status === "completed" ? "pending" : "completed";
      const delta = nextStatus === "completed" ? 1 : -1;
      return {
        ...s,
        optionalTasks: s.optionalTasks.map((t) => (t.id === id ? { ...t, status: nextStatus } : t)),
        attributes: applyAttributeDelta(s.attributes, task.attributeId, delta),
      };
    });
    const task = state.optionalTasks.find((t) => t.id === id);
    if (task) gainXp(task.status === "completed" ? -task.xp : task.xp);
  }

  function addOptionalTask(name, xp, attributeId) {
    setState((s) => ({ ...s, optionalTasks: [...s.optionalTasks, { id: uid("o"), name, xp, attributeId, status: "pending" }] }));
  }
  function removeOptionalTask(id) {
    setState((s) => ({ ...s, optionalTasks: s.optionalTasks.filter((t) => t.id !== id) }));
  }
  function updateMandatoryXp(tplId, val) {
    setState((s) => ({ ...s, mandatoryXpOverride: { ...s.mandatoryXpOverride, [tplId]: val } }));
  }
  function renameAttribute(id, name) {
    setState((s) => ({ ...s, attributes: s.attributes.map((a) => (a.id === id ? { ...a, name } : a)) }));
  }
  function addAttribute(name) {
    setState((s) => ({ ...s, attributes: [...s.attributes, { id: uid("attr"), name, value: 0, progress: 0 }] }));
  }
  function deleteAttribute(id) {
    const isDefault = DEFAULT_ATTRS.some((a) => a.id === id);
    if (isDefault) return;
    const usedInOptional = state.optionalTasks.some((t) => t.attributeId === id);
    if (usedInOptional) return;
    setState((s) => ({ ...s, attributes: s.attributes.filter((a) => a.id !== id) }));
  }
  function addSkill(name) { setState((s) => ({ ...s, skills: [...s.skills, { id: uid("sk"), name, level: 1 }] })); }
  function editSkillLevel(id, level) { setState((s) => ({ ...s, skills: s.skills.map((sk) => (sk.id === id ? { ...sk, level } : sk)) })); }
  function removeSkill(id) { setState((s) => ({ ...s, skills: s.skills.filter((sk) => sk.id !== id) })); }
  function addTitle(name) { setState((s) => ({ ...s, titles: [...s.titles, { id: uid("t"), name }] })); }
  function removeTitle(id) { setState((s) => ({ ...s, titles: s.titles.filter((t) => t.id !== id) })); }
  function addDungeon(type, name, xp) { setState((s) => ({ ...s, dungeons: [...s.dungeons, { id: uid("d"), type, name, xp, completed: false, date: todayStr() }] })); }
  function toggleDungeon(id) {
    setState((s) => {
      const d = s.dungeons.find((x) => x.id === id);
      if (!d) return s;
      return { ...s, dungeons: s.dungeons.map((x) => (x.id === id ? { ...x, completed: !x.completed } : x)) };
    });
    const d = state.dungeons.find((x) => x.id === id);
    if (d) gainXp(d.completed ? -d.xp : d.xp);
  }
  function removeDungeon(id) { setState((s) => ({ ...s, dungeons: s.dungeons.filter((d) => d.id !== id) })); }
  function togglePenaltyDone(id) { setState((s) => ({ ...s, penalties: s.penalties.map((p) => (p.id === id ? { ...p, completed: !p.completed } : p)) })); }

  const catA = MANDATORY_TEMPLATES.filter((t) => t.type === "mandatory_penalty");
  const catB = MANDATORY_TEMPLATES.filter((t) => t.type === "mandatory_no_penalty");

  return (
    <div dir="rtl" style={sx.app}>
      <style>{fontImport}</style>
      <div style={sx.headerWrap}>
        <div style={sx.eyebrow}>نظام التطور الشخصي</div>
        <div style={sx.headerRow}>
          <h1 style={sx.name}>{state.name}</h1>
          <div style={{ ...sx.rankBadge, borderColor: rank.color, color: rank.color, boxShadow: `0 0 14px ${rank.color}55` }}>{rank.name}</div>
        </div>
        <div style={sx.levelRow}>
          <span>المستوى {state.level}{state.level >= MAX_LEVEL ? " (الأقصى)" : ""}</span>
          <span>{state.xp} / {need} خ.خبرة</span>
        </div>
        <div style={sx.xpTrack}><div style={{ ...sx.xpFill, width: `${xpPct}%` }} /></div>
      </div>

      <div style={sx.content}>
        {tab === "home" && (
          <HomeTab
            catA={catA} catB={catB} state={state} attrMap={attrMap}
            unlocked={unlocked} countdown={countdown} xpEditUnlocked={xpEditUnlocked}
            onToggleMandatory={toggleMandatory} onUpdateXp={updateMandatoryXp}
            onToggleOptional={toggleOptional} onAddOptional={addOptionalTask} onRemoveOptional={removeOptionalTask}
            attributes={state.attributes}
          />
        )}
        {tab === "status" && (
          <StatusTab
            state={state} attrMap={attrMap}
            onAddSkill={addSkill} onEditSkillLevel={editSkillLevel} onRemoveSkill={removeSkill}
            onAddTitle={addTitle} onRemoveTitle={removeTitle}
            onAddDungeon={addDungeon} onToggleDungeon={toggleDungeon} onRemoveDungeon={removeDungeon}
            onTogglePenalty={togglePenaltyDone}
          />
        )}
        {tab === "settings" && (
          <SettingsTab state={state} onRename={renameAttribute} onAdd={addAttribute} onDelete={deleteAttribute} onNameChange={(name) => setState((s) => ({ ...s, name }))} />
        )}
        {tab === "history" && <HistoryTab history={state.history} />}
      </div>

      <nav style={sx.nav}>
        <NavBtn icon={Home} label="الرئيسية" active={tab === "home"} onClick={() => setTab("home")} />
        <NavBtn icon={User} label="الحالة" active={tab === "status"} onClick={() => setTab("status")} />
        <NavBtn icon={SettingsIcon} label="الإعدادات" active={tab === "settings"} onClick={() => setTab("settings")} />
        <NavBtn icon={HistoryIcon} label="السجل" active={tab === "history"} onClick={() => setTab("history")} />
      </nav>

      {levelUp && (
        <div onClick={() => setLevelUp(null)} style={sx.overlay}>
          <div style={{ textAlign: "center" }}>
            <ChevronUp size={40} color="#fbbf24" style={{ marginBottom: 8 }} />
            <div style={{ fontSize: 14, letterSpacing: 2, color: "#7a8ba8" }}>ترقية</div>
            <div style={sx.levelUpText}>المستوى {levelUp.level}</div>
          </div>
        </div>
      )}
    </div>
  );
}

function HomeTab({ catA, catB, state, attrMap, unlocked, countdown, xpEditUnlocked, onToggleMandatory, onUpdateXp, onToggleOptional, onAddOptional, onRemoveOptional, attributes }) {
  const [showAdd, setShowAdd] = useState(false);
  const [name, setName] = useState("");
  const [xp, setXp] = useState(10);
  const [attrId, setAttrId] = useState(attributes[0]?.id || "");

  return (
    <div>
      <Section title="المهام الإلزامية (عليها عقوبة)" icon={Skull} iconColor="#ff3b5c" right={<Countdown unlocked={unlocked} countdown={countdown} />}>
        {catA.map((tpl) => (
          <MandatoryRow key={tpl.id} tpl={tpl} state={state} attrMap={attrMap} unlocked={unlocked} xpEditUnlocked={xpEditUnlocked} onToggle={onToggleMandatory} onUpdateXp={onUpdateXp} />
        ))}
      </Section>

      <Section title="المهام الإلزامية (بدون عقوبة)" icon={Shield} iconColor="#4f9eff" right={<Countdown unlocked={unlocked} countdown={countdown} muted />}>
        {catB.map((tpl) => (
          <MandatoryRow key={tpl.id} tpl={tpl} state={state} attrMap={attrMap} unlocked={unlocked} xpEditUnlocked={xpEditUnlocked} onToggle={onToggleMandatory} onUpdateXp={onUpdateXp} noPenalty />
        ))}
      </Section>

      <Section title="المهام الاختيارية" icon={Award} iconColor="#a78bfa" right={<button onClick={() => setShowAdd((v) => !v)} style={sx.linkBtn}><Plus size={14} /> إضافة</button>}>
        {showAdd && (
          <div style={sx.addBox}>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="اسم المهمة" style={sx.input} />
            <div style={{ display: "flex", gap: 8 }}>
              <input type="number" value={xp} onChange={(e) => setXp(Number(e.target.value))} style={{ ...sx.input, width: 80 }} />
              <select value={attrId} onChange={(e) => setAttrId(e.target.value)} style={{ ...sx.input, flex: 1 }}>
                {attributes.map((a) => (<option key={a.id} value={a.id}>{a.name}</option>))}
              </select>
            </div>
            <button onClick={() => { if (name.trim()) { onAddOptional(name.trim(), xp, attrId); setName(""); setXp(10); setShowAdd(false); } }} style={sx.saveBtn}>حفظ المهمة</button>
          </div>
        )}
        {state.optionalTasks.length === 0 && !showAdd && <div style={sx.emptyText}>لا توجد مهام اختيارية بعد.</div>}
        {state.optionalTasks.map((t) => (
          <div key={t.id} style={sx.taskRow}>
            <CheckBtn done={t.status === "completed"} onClick={() => onToggleOptional(t.id)} />
            <span style={{ ...sx.taskName, textDecoration: t.status === "completed" ? "line-through" : "none" }}>{t.name}</span>
            <span style={sx.taskAttr}>{attrMap[t.attributeId]?.name}</span>
            <span style={sx.taskXp}>+{t.xp}</span>
            <button onClick={() => onRemoveOptional(t.id)} style={sx.iconBtn}><X size={14} /></button>
          </div>
        ))}
      </Section>
    </div>
  );
}

function Countdown({ unlocked, countdown, muted }) {
  return (
    <span style={{ fontSize: 11, color: muted ? "#5b7a9e" : unlocked ? "#7a8ba8" : "#ff3b5c", display: "flex", alignItems: "center", gap: 4 }}>
      <Clock size={12} />
      {unlocked ? `يغلق خلال ${countdown}` : `يفتح خلال ${countdown}`}
    </span>
  );
}

function MandatoryRow({ tpl, state, attrMap, unlocked, xpEditUnlocked, onToggle, onUpdateXp, noPenalty }) {
  const status = state.mandatoryStatus[tpl.id] || "pending";
  const xpVal = state.mandatoryXpOverride[tpl.id] ?? tpl.xp;
  const [editing, setEditing] = useState(false);
  const done = status === "completed";

  return (
    <div style={sx.taskRow}>
      {unlocked ? <CheckBtn done={done} onClick={() => onToggle(tpl)} /> : <div style={sx.lockedIcon}><Lock size={12} /></div>}
      <span style={{ ...sx.taskName, textDecoration: done ? "line-through" : "none", opacity: unlocked ? 1 : 0.5 }}>{tpl.name}</span>
      <span style={sx.taskAttr}>{attrMap[tpl.attributeId]?.name}</span>
      {editing ? (
        <input type="number" autoFocus defaultValue={xpVal}
          onBlur={(e) => { onUpdateXp(tpl.id, Number(e.target.value) || tpl.xp); setEditing(false); }}
          onKeyDown={(e) => e.key === "Enter" && e.target.blur()}
          style={{ ...sx.input, width: 50, padding: "2px 6px", fontSize: 12 }} />
      ) : (<span style={sx.taskXp}>+{xpVal}</span>)}
      {xpEditUnlocked && !editing && <button onClick={() => setEditing(true)} style={sx.iconBtn}><Pencil size={12} /></button>}
      {!noPenalty && <Flame size={12} color="#ff3b5c" opacity={0.6} />}
    </div>
  );
}

function CheckBtn({ done, onClick }) {
  return (
    <button onClick={onClick} style={{ ...sx.checkbox, background: done ? "#4f9eff" : "transparent", borderColor: done ? "#4f9eff" : "#3a5578" }}>
      {done && <Check size={13} color="#05070d" strokeWidth={3} />}
    </button>
  );
}

function StatusTab({ state, attrMap, onAddSkill, onEditSkillLevel, onRemoveSkill, onAddTitle, onRemoveTitle, onAddDungeon, onToggleDungeon, onRemoveDungeon, onTogglePenalty }) {
  const [skillName, setSkillName] = useState("");
  const [titleName, setTitleName] = useState("");
  const [dName, setDName] = useState("");
  const [dXp, setDXp] = useState(20);
  const [dType, setDType] = useState("focus");

  return (
    <div>
      <Section title="الخصائص" icon={Swords} iconColor="#4f9eff">
        {state.attributes.map((a) => (
          <div key={a.id} style={sx.attrRow}>
            <span style={sx.taskName}>{a.name}</span>
            <span style={sx.attrValue}>{a.value}</span>
            <span style={sx.attrProgress}>({a.progress}/2)</span>
          </div>
        ))}
      </Section>

      <Section title="الألقاب" icon={Award} iconColor="#fbbf24" right={<AddInline value={titleName} setValue={setTitleName} onAdd={() => { if (titleName.trim()) { onAddTitle(titleName.trim()); setTitleName(""); } }} />}>
        {state.titles.length === 0 && <div style={sx.emptyText}>لا توجد ألقاب بعد.</div>}
        {state.titles.map((t) => (
          <div key={t.id} style={sx.taskRow}>
            <span style={sx.taskName}>{t.name}</span>
            <button onClick={() => onRemoveTitle(t.id)} style={sx.iconBtn}><X size={14} /></button>
          </div>
        ))}
      </Section>

      <Section title="المهارات" icon={Brain} iconColor="#a78bfa" right={<AddInline value={skillName} setValue={setSkillName} onAdd={() => { if (skillName.trim()) { onAddSkill(skillName.trim()); setSkillName(""); } }} />}>
        {state.skills.length === 0 && <div style={sx.emptyText}>لا توجد مهارات بعد.</div>}
        {state.skills.map((s) => (
          <div key={s.id} style={sx.taskRow}>
            <span style={sx.taskName}>{s.name}</span>
            <input type="number" defaultValue={s.level} onBlur={(e) => onEditSkillLevel(s.id, Number(e.target.value) || 1)} style={{ ...sx.input, width: 50, padding: "2px 6px", fontSize: 12 }} />
            <button onClick={() => onRemoveSkill(s.id)} style={sx.iconBtn}><X size={14} /></button>
          </div>
        ))}
      </Section>

      <Section title="الزنزانات" icon={Castle} iconColor="#7dd3fc">
        <div style={sx.addBox}>
          <input value={dName} onChange={(e) => setDName(e.target.value)} placeholder="اسم الزنزانة / الهدف" style={sx.input} />
          <div style={{ display: "flex", gap: 8 }}>
            <select value={dType} onChange={(e) => setDType(e.target.value)} style={{ ...sx.input, flex: 1 }}>
              <option value="focus">زنزانة تركيز (ساعة بدون هاتف)</option>
              <option value="weekly_goal">هدف أسبوعي</option>
            </select>
            <input type="number" value={dXp} onChange={(e) => setDXp(Number(e.target.value))} style={{ ...sx.input, width: 70 }} />
          </div>
          <button onClick={() => { if (dName.trim()) { onAddDungeon(dType, dName.trim(), dXp); setDName(""); } }} style={sx.saveBtn}>إضافة زنزانة</button>
        </div>
        {state.dungeons.length === 0 && <div style={sx.emptyText}>لا توجد زنزانات مسجّلة.</div>}
        {state.dungeons.map((d) => (
          <div key={d.id} style={sx.taskRow}>
            <CheckBtn done={d.completed} onClick={() => onToggleDungeon(d.id)} />
            <span style={{ ...sx.taskName, textDecoration: d.completed ? "line-through" : "none" }}>{d.name}</span>
            <span style={sx.taskAttr}>{d.type === "focus" ? "تركيز" : "أسبوعي"}</span>
            <span style={sx.taskXp}>+{d.xp}</span>
            <button onClick={() => onRemoveDungeon(d.id)} style={sx.iconBtn}><X size={14} /></button>
          </div>
        ))}
      </Section>

      <Section title="عقوبات اليوم" icon={Skull} iconColor="#ff3b5c">
        {state.penalties.filter((p) => !p.completed).length === 0 && <div style={sx.emptyText}>لا توجد عقوبات معلّقة.</div>}
        {state.penalties.filter((p) => !p.completed).map((p) => (
          <div key={p.id} style={sx.taskRow}>
            <CheckBtn done={p.completed} onClick={() => onTogglePenalty(p.id)} />
            <span style={sx.taskName}>{p.description}</span>
            <span style={sx.taskAttr}>{p.date}</span>
          </div>
        ))}
      </Section>
    </div>
  );
}

function AddInline({ value, setValue, onAdd }) {
  const [open, setOpen] = useState(false);
  if (!open) return <button onClick={() => setOpen(true)} style={sx.linkBtn}><Plus size={14} /> إضافة</button>;
  return (
    <div style={{ display: "flex", gap: 6 }}>
      <input value={value} onChange={(e) => setValue(e.target.value)} style={{ ...sx.input, width: 120, padding: "4px 8px", fontSize: 12 }} onKeyDown={(e) => e.key === "Enter" && (onAdd(), setOpen(false))} autoFocus />
      <button onClick={() => { onAdd(); setOpen(false); }} style={sx.iconBtn}><Check size={14} /></button>
    </div>
  );
}

function SettingsTab({ state, onRename, onAdd, onDelete, onNameChange }) {
  const [newAttr, setNewAttr] = useState("");
  return (
    <div>
      <Section title="اسم المستخدم" icon={User} iconColor="#4f9eff">
        <input defaultValue={state.name} onBlur={(e) => onNameChange(e.target.value.trim() || state.name)} style={sx.input} />
      </Section>
      <Section title="أسماء الخصائص" icon={Pencil} iconColor="#a78bfa">
        {state.attributes.map((a) => {
          const isDefault = DEFAULT_ATTRS.some((d) => d.id === a.id);
          return (
            <div key={a.id} style={sx.taskRow}>
              <input defaultValue={a.name} onBlur={(e) => onRename(a.id, e.target.value.trim() || a.name)} style={{ ...sx.input, flex: 1 }} />
              {!isDefault && <button onClick={() => onDelete(a.id)} style={sx.iconBtn}><Trash2 size={14} /></button>}
            </div>
          );
        })}
        <div style={sx.addBox}>
          <input value={newAttr} onChange={(e) => setNewAttr(e.target.value)} placeholder="اسم خاصية جديدة" style={sx.input} />
          <button onClick={() => { if (newAttr.trim()) { onAdd(newAttr.trim()); setNewAttr(""); } }} style={sx.saveBtn}>إضافة خاصية</button>
        </div>
      </Section>
      <div style={sx.note}>تعديل نقاط الخبرة للمهام الإلزامية يصبح متاحًا بعد الوصول للمستوى 25.</div>
    </div>
  );
}

function HistoryTab({ history }) {
  return (
    <Section title="السجل" icon={HistoryIcon} iconColor="#7a8ba8">
      {history.length === 0 && <div style={sx.emptyText}>لا يوجد سجل بعد — سيظهر هنا بعد أول يوم مكتمل.</div>}
      {history.map((h, i) => (
        <div key={i} style={sx.historyRow}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={{ fontWeight: 700 }}>{h.date}</span>
            <span style={{ color: "#7a8ba8", fontSize: 12 }}>مستوى {h.level}</span>
          </div>
          <div style={{ fontSize: 12, color: "#7a8ba8", marginTop: 4 }}>أُنجز {h.completed} — فشل {h.failed}</div>
        </div>
      ))}
    </Section>
  );
}

function Section({ title, icon: Icon, iconColor, right, children }) {
  return (
    <div style={sx.panel}>
      <div style={sx.sectionHeader}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <Icon size={15} color={iconColor} />
          <span style={sx.sectionTitle}>{title}</span>
        </div>
        {right}
      </div>
      <div style={{ display: "grid", gap: 8 }}>{children}</div>
    </div>
  );
}

function NavBtn({ icon: Icon, label, active, onClick }) {
  return (
    <button onClick={onClick} style={{ ...sx.navBtn, color: active ? "#4f9eff" : "#5b7a9e" }}>
      <Icon size={18} />
      <span style={{ fontSize: 10 }}>{label}</span>
    </button>
  );
}

const fontImport = `
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
  button { cursor: pointer; }
`;

const sx = {
  app: { minHeight: "100vh", background: "radial-gradient(circle at 50% 0%, #0a1428 0%, #05070d 55%)", color: "#e6f1ff", paddingBottom: 70 },
  loadingScreen: { minHeight: "100vh", background: "#05070d", display: "flex", alignItems: "center", justifyContent: "center", color: "#4f9eff", fontFamily: "Cairo, sans-serif" },
  headerWrap: { padding: "20px 16px 14px", maxWidth: 480, margin: "0 auto" },
  eyebrow: { fontSize: 11, letterSpacing: 1, color: "#5b7a9e", marginBottom: 4 },
  headerRow: { display: "flex", alignItems: "center", justifyContent: "space-between" },
  name: { fontSize: 22, fontWeight: 800, margin: 0 },
  rankBadge: { width: 40, height: 40, borderRadius: "50%", border: "2px solid", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 16 },
  levelRow: { display: "flex", justifyContent: "space-between", fontSize: 12, color: "#7a8ba8", marginTop: 10, marginBottom: 4 },
  xpTrack: { height: 8, background: "#0b1120", border: "1px solid #1e3a5f", overflow: "hidden" },
  xpFill: { height: "100%", background: "linear-gradient(90deg,#2563eb,#4f9eff)", transition: "width 0.4s ease" },
  content: { maxWidth: 480, margin: "0 auto", padding: "0 16px" },
  panel: { background: "linear-gradient(180deg, rgba(20,32,56,0.85), rgba(10,16,30,0.85))", border: "1px solid #1e3a5f", borderRadius: 10, padding: 14, marginTop: 14 },
  sectionHeader: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 },
  sectionTitle: { fontSize: 13, color: "#c7d6ee", letterSpacing: 0.3, fontWeight: 700 },
  taskRow: { display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", background: "#0b1120", border: "1px solid #16223a", borderRadius: 8 },
  taskName: { flex: 1, fontSize: 13.5 },
  taskAttr: { fontSize: 10.5, color: "#7a8ba8", background: "#101c33", padding: "2px 6px", borderRadius: 5 },
  taskXp: { fontSize: 11, color: "#4f9eff", minWidth: 30, textAlign: "left" },
  checkbox: { width: 22, height: 22, minWidth: 22, borderRadius: 5, border: "2px solid", display: "flex", alignItems: "center", justifyContent: "center" },
  lockedIcon: { width: 22, height: 22, minWidth: 22, borderRadius: 5, border: "2px solid #2b3d58", display: "flex", alignItems: "center", justifyContent: "center", color: "#3a5578" },
  iconBtn: { background: "none", border: "none", color: "#5b7a9e", padding: 2 },
  linkBtn: { background: "none", border: "none", color: "#4f9eff", display: "flex", alignItems: "center", gap: 4, fontSize: 12 },

  saveBtn: { background: "#2563eb", border: "none", color: "#fff", padding: "8px 0", borderRadius: 6, fontSize: 13 },
  emptyText: { fontSize: 12.5, color: "#5b7a9e", textAlign: "center", padding: "8px 0" },
  attrRow: { display: "flex", alignItems: "center", gap: 8, padding: "6px 10px" },
  attrValue: { fontWeight: 700, color: "#4f9eff", fontSize: 14 },
  attrProgress: { fontSize: 11, color: "#5b7a9e" },
  historyRow: { background: "#0b1120", border: "1px solid #16223a", borderRadius: 8, padding: 10 },
  note: { fontSize: 11.5, color: "#5b7a9e", padding: "10px 4px", textAlign: "center" },
  nav: { position: "fixed", bottom: 0, left: 0, right: 0, background: "#0a0f1c", borderTop: "1px solid #1e3a5f", display: "flex", justifyContent: "space-around", padding: "8px 0" },
  navBtn: { background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3 },
  overlay: { position: "fixed", inset: 0, background: "rgba(5,7,13,0.85)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50 },
  levelUpText: { fontSize: 40, fontWeight: 800, color: "#fbbf24", textShadow: "0 0 24px rgba(251,191,36,0.6)" },
};

root.render(<App />);
</script>
